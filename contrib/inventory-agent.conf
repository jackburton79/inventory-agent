# Example configuration for inventory-agent. See README.md for all the keys.

# Inventory server. For HTTP basic authentication use
# https://user:password@host/path
server = https://glpi.example.com/

# Inventory format: FORMAT_OCS or FORMAT_GLPI
format = FORMAT_GLPI

# Only for testing: skip the verification of the server certificate
#no_ssl_check = true

# Daemon mode: seconds between two inventories (default: one day)
#schedule_interval = 86400

# Daemon mode: web server port (0 disables it) and addresses allowed
# to force an inventory
#httpd-port = 62354
#httpd-trust = 10.0.0.10, 10.0.0.11
